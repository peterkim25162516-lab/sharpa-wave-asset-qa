[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharpa-wave-asset-qa"
version = "0.1.0"
description = "CPU-first cross-format validation and regression reporting for public Sharpa Wave robot assets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Qiyan Jin" },
]
keywords = ["robotics", "mujoco", "urdf", "usd", "asset-validation", "dexterous-hand"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
simulation = [
  "mujoco>=3.2",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
waveqa = "wave_asset_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["wave_asset_qa"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
